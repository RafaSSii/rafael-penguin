default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: rafael_penguin_development

test:
  <<: *default
  database: rafael_penguin_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "rafael_penguin_production") %>
  username: <%= ENV.fetch("DB_USER", "rafael_penguin") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
